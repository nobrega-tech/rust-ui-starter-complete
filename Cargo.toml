[workspace]
resolver = "2"
members = [
    "apps/web",
    "apps/desktop",
    "crates/core",
    "crates/design-system",
]
exclude = ["apps/api", "crates/api"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["launch", "lib", "devtools", "logger"] }
